[package]
name = "synth_sequencer"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Sequencer and pattern system for modular synthesizer"
authors = ["Per"]
license = "MIT"

[lints]
workspace = true

[features]
default = []
gui-egui = ["dep:eframe", "dep:egui_extras"]

[dependencies]
synth_core = { path = "../synth_core" }
serde = { workspace = true }
eframe = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
