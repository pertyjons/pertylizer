[package]
name = "synth_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Synth engine with voice allocation, graph processing, and sequencer"
authors = ["Per"]
license = "MIT"

[lints]
workspace = true

[dependencies]
synth_core = { path = "../synth_core" }
synth_dsp = { path = "../synth_dsp" }
synth_modules = { path = "../synth_modules" }
synth_awe = { path = "../synth_awe" }
synth_sequencer = { path = "../synth_sequencer" }
synth_osc_protocol = { path = "../synth_osc_protocol", features = ["serde"] }
serde = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
ringbuf = { workspace = true }
fastrand = { workspace = true }
