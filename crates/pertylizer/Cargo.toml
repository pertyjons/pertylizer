[package]
name = "pertylizer"
version = "0.317.0"
edition.workspace = true
rust-version.workspace = true
description = "Pertylizer — a modular synthesizer"
authors.workspace = true
license.workspace = true
default-run = "pertylizer"

[[example]]
name = "evd_0016_cpal_timestamps"
test = true

[lints]
workspace = true

[features]
default = ["gui-egui", "mcp", "osc"]
gui-egui = [
    "dep:eframe",
    "dep:egui",
    "dep:egui_extras",
    "dep:egui-file-dialog",
    "dep:egui-remixicon",
    "dep:image",
    "dep:winit",
]
mcp = ["dep:tokio"]
osc = ["dep:synth_osc"]
# Opt-in (NOT in default): the Phase 4 Core V2 lowering path. This is the one
# feature that links the experimental `synth_engine_v2` crate into a shipping
# target, and `crate_boundary` in that crate is what keeps the exception from
# widening. Off by default so V1 remains the default renderer and the default
# build still has no edge to the experimental crate at all.
v2-lowering = ["dep:synth_engine_v2"]
# Opt-in audio-callback timing. Keep disabled for normal low-jitter operation.
rt-profiling = ["synth_engine/rt-profiling"]
# Opt-in (NOT in default): pulls eframe's `inspection` feature, which links
# `egui_inspection` + `accesskit` so an external `egui-mcp` server can drive the
# live UI over AccessKit. Dormant unless `EGUI_INSPECTION=1` is set at runtime.
# Kept out of default so release/CI builds don't link accesskit unnecessarily.
egui-inspection = ["eframe/inspection"]
# CPAL's native PipeWire host is now resolvable, but enabling it adds a Linux
# system-library dependency and a second host/device-selection contract. Keep it
# out until packaging and release-platform behavior are specified and tested.

[dependencies]
synth_core = { path = "../synth_core" }
synth_config = { path = "../synth_config" }
synth_dsp = { path = "../synth_dsp" }
synth_sequencer = { path = "../synth_sequencer" }
synth_modules = { path = "../synth_modules" }
synth_engine = { path = "../synth_engine" }
synth_sampler = { path = "../synth_sampler" }
synth_script = { path = "../synth_script" } # YAMS control-script compiler (non-RT, load/authoring)
# Experimental Core V2 render core. Optional, and reached only through the
# non-default `v2-lowering` feature; see that feature and `crate_boundary`.
synth_engine_v2 = { path = "../synth_engine_v2", optional = true }

# Audio I/O
cpal = { workspace = true }

# MIDI I/O
midir = { workspace = true }

# Lock-free communication
ringbuf = { workspace = true }

# Fast mutex for visualization buffers
parking_lot = { workspace = true }

# Error handling
thiserror = { workspace = true }

# WAV export
hound = { workspace = true }

# Fast random number generation
fastrand = { workspace = true }

# Data parallelism for the offline per-track render loop
rayon = { workspace = true }

# Serialization for save/load
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

# Enum utilities. `EnumIter` makes the V2 reference corpus's category set
# self-enumerating, so the manifest's coverage check cannot miss a category that
# was added to the enum but never to the corpus.
strum = { workspace = true }

# ZIP archive (bundle project format)
zip = { workspace = true }

# Atomic file replacement (write to a temp file beside the destination, then
# rename over it) so a failed save never truncates the user's last good file.
tempfile = { workspace = true }

# File system paths
dirs = { workspace = true }

# Command-line argument parsing (binary target).
clap = { workspace = true }

# Content digests for the `render` command's JSON receipt.
sha2 = { workspace = true }

# GUI - egui (optional)
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
egui-file-dialog = { workspace = true, optional = true }
egui-remixicon = { workspace = true, optional = true }
image = { workspace = true, optional = true }

# MCP server (optional)
synth_mcp = { path = "../synth_mcp" }
tokio = { workspace = true, optional = true }

# Structured logging (subscriber init lives in main; library code uses
# `tracing` macros which compile to no-ops when no subscriber is set).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }

# OSC telemetry (optional)
synth_osc = { path = "../synth_osc", optional = true }

# Date/time — local-time timestamps for the activity-log console.
chrono = { workspace = true }

# Force winit to draw Adwaita-style CSD on Wayland (eframe enables only
# winit/wayland, which omits any CSD feature — leaving GNOME windows with
# no title bar). Cargo unifies features across the dep graph, so adding
# the feature here applies to the same winit crate eframe uses.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { workspace = true, features = ["wayland-csd-adwaita"], optional = true }

[build-dependencies]
# UTC build-stamp formatting (replaces the hand-rolled civil-calendar math).
chrono = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
hound = { workspace = true }
# EVD-0014 compares V1 against V2 in one binary, and EVD-0016 embeds V2's quantum
# in its CPAL artifact. Dev-only, so neither reaches the delivered dependency
# graph. `crate_boundary` names the exception and pins the permitted harnesses.
synth_engine_v2 = { path = "../synth_engine_v2" }

[[bin]]
name = "pertylizer"
path = "src/main.rs"
