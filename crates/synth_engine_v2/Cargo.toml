[package]
name = "synth_engine_v2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental Sound Core V2 render core for Pertylizer (Phase 1)"
authors.workspace = true
license.workspace = true

[[example]]
name = "evd_0016_host_time"
test = true

# ADR-0053 clause 5 forbids a live adapter from stamping `TimeSource::Simulated` and asks
# the ingress slice for a visibility or feature boundary, so a release build need not reach
# the producer that does. This is that boundary, and it gates the **constructors** rather
# than the module: `PerformanceIngress::prepare` and the three `StreamControl` offers are
# the only ways to build or fill a store, so withholding them is enough, and gating the
# module instead spread `cfg` through the scheduler and the stream for no more safety.
#
# On by default, because the exit gate's equivalence fixture is what proves the tag
# reachable at all and the ordinary gate has to run it; a consumer that must not carry the
# producer builds with `--no-default-features`, which the complete repository gate compiles.
# What a boundary cannot do is constrain a downstream consumer of a public enum, which is
# why clause 5 remains contractual on top of it.
[features]
default = ["simulated-ingress"]
simulated-ingress = []

[lints]
workspace = true

# The Phase 1 work list fixes this dependency surface: `synth_core` for existing
# domain newtypes, selected DSP kernels, and nothing else. No GUI, MCP, OSC,
# CPAL, filesystem, or project-loading dependency may appear here — a test in
# `tests/crate_boundary.rs` reads this manifest and fails if one does.
[dependencies]
synth_core = { path = "../synth_core" }
thiserror = { workspace = true }

# Test-only. The Phase 1 work list fixes this crate's `[dependencies]` surface, and
# `crate_boundary` checks it against an allowlist; a digest used by ADR-0041 clause 16's
# baseline check does not widen it. (That test asks Cargo, not the manifest text, which
# crates reach *this* one — the two questions are separate.)
[dev-dependencies]
sha2 = { workspace = true }
