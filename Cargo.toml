[workspace]
resolver = "2"
members = [
    "crates/synth_core",
    "crates/synth_config",
    "crates/synth_dsp",
    "crates/synth_sequencer",
    "crates/synth_modules",
    "crates/synth_script",
    "crates/synth_sampler",
    "crates/synth_engine",
    "crates/synth_mcp",
    "crates/synth_osc",
    "crates/synth_osc_protocol",
    "crates/pertylizer",
]
exclude = ["visualizer"]

# Default to run the main application
default-members = ["crates/pertylizer"]

# Vendored fork bumped to egui 0.35 (upstream has no 0.35 release yet).
# Remove once egui-remixicon publishes a 0.35-compatible version.
# (egui-file-dialog 0.14.1 is now 0.35-native on crates.io — fork dropped.)
[patch.crates-io]
egui-remixicon = { path = "third_party/egui-remixicon" }

[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["Per Jonsson"]
license = "MIT"
repository = "https://github.com/pertyjons/pertylizer"
description = "Pertylizer — a modular synthesizer with 75 module types (including 26 effects) and MCP integration"

[workspace.dependencies]
# Core dependencies
# "rc" enables Serialize/Deserialize for Rc/Arc (used by AutomationTarget's
# Arc<str> param id). Inert for existing types — a serialized struct holding
# Rc/Arc would not compile without it, so none exist today.
serde = { version = "1.0.229", features = ["derive", "rc"] }
# `raw_value` lets `get_project_schema` pass the embedded 251 KB schema through
# verbatim (Box<RawValue>) instead of parsing it into a Value tree and
# re-serializing on every call.
serde_json = { version = "1.0.151", features = ["raw_value"] }
# TOML parsing for the runtime config file (pertylizer.toml).
toml = "1.1.4"
thiserror = "2.0.19"
# Date/time. `clock` pulls in `Local`/`Utc::now()` via `iana-time-zone` for
# correct, multithreaded-safe local time (unlike `time`'s `now_local`); we drop
# the default `wasmbind`/`oldtime` features. Used for the activity-log console's
# local HH:MM:SS and the UTC build stamp in build.rs.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Enum utilities — `EnumIter` makes `ModuleType` self-enumerating so the MCP /
# GUI module catalogs can never drift from the enum.
strum = { version = "0.28.0", features = ["derive"] }

# Audio I/O.
# `realtime` promotes cpal's audio callback threads to RT scheduling
# (SCHED_FIFO on Linux) without pulling in D-Bus. It degrades gracefully to
# normal priority when the process lacks rtprio privileges.
cpal = { version = "0.18.1", features = ["realtime"] }

# MIDI I/O
midir = "0.11.0"

# Lock-free communication
ringbuf = "0.5.1"
arc-swap = "1.9.2"

# Compile-time assertions (Send bounds / layout of thread-transferred structs).
static_assertions = "1.1.0"

# Fast mutex for visualization buffers
parking_lot = "0.12.5"

# FFT (spectral analysis)
realfft = "3.5.0"

# OSC (Open Sound Control)
rosc = "0.11.4"

# Fast random number generation
fastrand = "2.5.0"

# Data parallelism (used by offline per-track renderers)
rayon = "1.12.0"

# WAV export
hound = "3.5.1"

# Base64 encoding
base64 = "0.23.1"

# ZIP archive (bundle project format)
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Testing
tempfile = "3.27.0"
jsonschema = "0.49.5"

# Fixed-size heap-free collections
arrayvec = "0.7.8"

# File system paths
dirs = "6.0.0"

# Async combinators (FutureExt::catch_unwind for MCP panic isolation).
# Only the `std` feature is needed (catch_unwind); already pulled transitively.
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }

# MCP (Model Context Protocol)
rmcp = { version = "3.1.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "net"] }
schemars = "1.2.2"
axum = "0.8.9"
tokio-util = { version = "0.7.19", features = ["rt"] }

# Structured logging (used by MCP server to trace session lifecycle / errors)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# Bridges the `log` crate (used by egui/eframe) into tracing so their warnings
# (e.g. egui id-clash) reach our stderr output.
tracing-log = "0.2.0"

# GUI - egui
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.35.0" }
egui_extras = { version = "0.35.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
egui-file-dialog = { version = "0.14.1" }
egui-remixicon = { version = "0.34.0" }

# Winit — pinned to the version eframe depends on. Linux-only override
# in pertylizer adds wayland-csd-adwaita so GNOME draws a title bar.
winit = { version = "0.30.13", default-features = false }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Allow these for synth-appropriate exceptions
must_use_candidate = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Allow for DSP code that uses these patterns intentionally
should_implement_trait = "allow"
needless_range_loop = "allow"
vec_box = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1  # Some optimization in dev for audio performance
