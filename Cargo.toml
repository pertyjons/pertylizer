[workspace]
resolver = "2"
members = [
    "crates/synth_core",
    "crates/synth_dsp",
    "crates/synth_sequencer",
    "crates/synth_modules",
    "crates/synth_engine",
    "crates/modular_synth",
]

# Default to run the main applicationj99nnhfdc
default-members = ["crates/modular_synth"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
authors = ["Per"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

# Audio I/O
cpal = "0.17.1"

# MIDI I/O
midir = "0.10.3"

# Lock-free communication
ringbuf = "0.4.8"

# Fast mutex for visualization buffers
parking_lot = "0.12.5"

# Fast random number generation
fastrand = "2.3.0"

# Fixed-size heap-free collections
arrayvec = "0.7.6"

# File system paths
dirs = "6.0.0"

# WAV file reading for samples
hound = "3.5.1"

# Tracker module import (MOD, XM, S3M)
xmrs = { version = "0.9.9", features = ["std", "import"] }

# GUI - egui (optional)
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.33.3" }
egui_extras = { version = "0.33.3" }
egui-file-dialog = { version = "0.12.0" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Allow these for synth-appropriate exceptions
must_use_candidate = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Allow for DSP code that uses these patterns intentionally
should_implement_trait = "allow"
needless_range_loop = "allow"
vec_box = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Lite optimering även i dev för audio
