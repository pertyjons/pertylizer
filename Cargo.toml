[workspace]
resolver = "2"
members = [
    "crates/synth_core",
    "crates/synth_config",
    "crates/synth_dsp",
    "crates/synth_sequencer",
    "crates/synth_modules",
    "crates/synth_awe",
    "crates/synth_sampler",
    "crates/synth_engine",
    "crates/synth_mcp",
    "crates/synth_osc",
    "crates/synth_osc_protocol",
    "crates/pertylizer",
]
exclude = ["visualizer"]

# Default to run the main application
default-members = ["crates/pertylizer"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Per Jonsson"]
license = "MIT"
repository = "https://github.com/pertyjons/pertylizer"
description = "Pertylizer — a modular synthesizer with 67 module types (including 25 effects) and MCP integration"

[workspace.dependencies]
# Core dependencies
# "rc" enables Serialize/Deserialize for Rc/Arc (used by AutomationTarget's
# Arc<str> param id). Inert for existing types — a serialized struct holding
# Rc/Arc would not compile without it, so none exist today.
serde = { version = "1.0.228", features = ["derive", "rc"] }
# `raw_value` lets `get_project_schema` pass the embedded 251 KB schema through
# verbatim (Box<RawValue>) instead of parsing it into a Value tree and
# re-serializing on every call.
serde_json = { version = "1.0.150", features = ["raw_value"] }
# TOML parsing for the runtime config file (pertylizer.toml).
toml = "0.9.5"
thiserror = "2.0.18"

# Audio I/O
cpal = "0.17.3"

# MIDI I/O
midir = "0.11.0"

# Lock-free communication
ringbuf = "0.5.0"

# Fast mutex for visualization buffers
parking_lot = "0.12.5"

# FFT (spectral analysis)
realfft = "3.5.0"

# OSC (Open Sound Control)
rosc = "0.11.4"

# Fast random number generation
fastrand = "2.4.1"

# Data parallelism (used by offline per-track renderers)
rayon = "1.12.0"

# WAV export
hound = "3.5.1"

# Base64 encoding
base64 = "0.22.1"

# ZIP archive (bundle project format)
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Testing
tempfile = "3.27.0"
jsonschema = "0.46.5"

# Fixed-size heap-free collections
arrayvec = "0.7.6"

# File system paths
dirs = "6.0.0"

# Async combinators (FutureExt::catch_unwind for MCP panic isolation).
# Only the `std` feature is needed (catch_unwind); already pulled transitively.
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }

# MCP (Model Context Protocol)
rmcp = { version = "1.7.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std", "net"] }
schemars = "1.2.1"
axum = "0.8.9"
tokio-util = { version = "0.7.18", features = ["rt"] }

# Structured logging (used by MCP server to trace session lifecycle / errors)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# GUI - egui
eframe = { version = "0.34.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.34.3" }
egui_extras = { version = "0.34.3", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
egui-file-dialog = { version = "0.13.0" }
egui-remixicon = { version = "0.34.0" }

# Winit — pinned to the version eframe depends on. Linux-only override
# in pertylizer adds wayland-csd-adwaita so GNOME draws a title bar.
winit = { version = "0.30.13", default-features = false }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Allow these for synth-appropriate exceptions
must_use_candidate = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Allow for DSP code that uses these patterns intentionally
should_implement_trait = "allow"
needless_range_loop = "allow"
vec_box = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1  # Some optimization in dev for audio performance
