[workspace]
resolver = "2"
members = [
    "crates/synth_core",
    "crates/synth_dsp",
    "crates/synth_sequencer",
    "crates/synth_modules",
    "crates/synth_awe",
    "crates/synth_sampler",
    "crates/synth_engine",
    "crates/synth_mcp",
    "crates/synth_osc",
    "crates/synth_osc_protocol",
    "crates/pertylizer",
]
exclude = ["visualizer"]

# Default to run the main application
default-members = ["crates/pertylizer"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
authors = ["Per Jonsson"]
license = "MIT"
repository = "https://github.com/pertyjons/pertylizer"
description = "Pertylizer — a modular synthesizer with 35 voice modules, 21 effects, and MCP integration"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

# Audio I/O
# Pinned to 0.17.1: cpal 0.17.3 requires alsa 0.11 (alsa-sys 0.4) which conflicts
# with midir 0.10.3's dependency on alsa 0.9 (alsa-sys 0.3.1) via the `links = "alsa"` constraint.
# Upgrade when midir releases a version compatible with alsa-sys 0.4.
cpal = "0.17.1"

# MIDI I/O
midir = "0.10.3"

# Lock-free communication
ringbuf = "0.4.8"

# Fast mutex for visualization buffers
parking_lot = "0.12.5"

# FFT (spectral analysis)
realfft = "3.5.0"

# OSC (Open Sound Control)
rosc = "0.11.4"

# Fast random number generation
fastrand = "2.4.1"

# WAV export
hound = "3.5.1"

# Base64 encoding
base64 = "0.22.1"

# ZIP archive (bundle project format)
zip = { version = "8.5.1", default-features = false, features = ["deflate"] }

# Testing
tempfile = "3.27.0"

# Fixed-size heap-free collections
arrayvec = "0.7.6"

# File system paths
dirs = "6.0.0"

# MCP (Model Context Protocol)
rmcp = { version = "1.2", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "io-std", "net"] }
schemars = "1.2"
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }

# GUI - egui
eframe = { version = "0.34.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.34.1" }
egui_extras = { version = "0.34.1" }
egui-file-dialog = { version = "0.13.0" }
egui-remixicon = { version = "0.34.0" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Allow these for synth-appropriate exceptions
must_use_candidate = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Allow for DSP code that uses these patterns intentionally
should_implement_trait = "allow"
needless_range_loop = "allow"
vec_box = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1  # Some optimization in dev for audio performance
