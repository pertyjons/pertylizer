name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check Core V2 documentation
        run: |
          python3 -B scripts/check_v2_docs.py --evidence
          python3 -B -m unittest scripts/test_check_v2_docs.py
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: V2 GUI Clippy
        run: cargo clippy -p pertylizer --all-targets --features v2-lowering
      - name: Test
        run: cargo test --workspace
      - name: V2 GUI tests
        run: cargo test -p pertylizer --features v2-lowering --lib gui::egui_backend::v2_flow::
      - name: Mixed transfer rehearsal tests
        run: |
          cargo test -p synth_engine_v2 --no-default-features --features mixed-transfer-rehearsal --test mixed_transfer_rehearsal
          cargo test -p synth_engine_v2 --no-default-features --features mixed-transfer-rehearsal --test mixed_source_bridge
          cargo test -p synth_engine_v2 --no-default-features --features mixed-transfer-rehearsal --lib
          cargo test -p synth_engine_v2 --no-default-features --features mixed-transfer-rehearsal --doc
      - name: Mixed transfer rehearsal Clippy
        run: cargo clippy -p synth_engine_v2 --all-targets --no-default-features --features mixed-transfer-rehearsal
      # The oversized-callback resource probe (LIMIT-0001, EVD-0006) has a
      # #[cfg(not(debug_assertions))] arm that dev-profile test runs never
      # compile; without this step no gate would ever execute or type-check it.
      - name: Release-mode resource probe
        run: cargo test -p synth_engine --release resource_limit_probe_oversized_callback_exposes_build_mode_failure
      - name: Documentation
        run: cargo doc --workspace --no-deps
      - name: Minimal feature set
        run: cargo check --workspace --all-targets --no-default-features
      - name: Complete feature set
        run: cargo check --workspace --all-targets --all-features
      - name: Headless V2 feature
        run: cargo check -p pertylizer --no-default-features --features v2-lowering

  msrv:
    name: Rust 1.98
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Check workspace at MSRV
        run: cargo check --workspace
