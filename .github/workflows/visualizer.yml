name: Visualizer Build & Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Visualizer Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: visualizer
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Build
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: visualizer-ubuntu
          path: visualizer/target/release/pertylizer-visualizer

  macos:
    name: Visualizer macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: visualizer
      - name: Build
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: visualizer-macos
          path: visualizer/target/release/pertylizer-visualizer

  windows:
    name: Visualizer Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: visualizer
      - name: Build
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: visualizer-windows
          path: visualizer/target/release/pertylizer-visualizer.exe

  release:
    name: Visualizer Release
    needs: [ubuntu, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' visualizer/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=visualizer-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "visualizer-v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        if: steps.check.outputs.exists == 'false'
        run: |
          cd artifacts
          mv visualizer-ubuntu/pertylizer-visualizer pertylizer-visualizer-linux-x86_64
          mv visualizer-macos/pertylizer-visualizer pertylizer-visualizer-macos-aarch64
          mv visualizer-windows/pertylizer-visualizer.exe pertylizer-visualizer-windows-x86_64.exe
          chmod +x pertylizer-visualizer-linux-x86_64 pertylizer-visualizer-macos-aarch64

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Pertylizer Visualizer ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            artifacts/pertylizer-visualizer-linux-x86_64 \
            artifacts/pertylizer-visualizer-macos-aarch64 \
            artifacts/pertylizer-visualizer-windows-x86_64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
