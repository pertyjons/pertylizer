name: Build & Test

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Format check
        run: cargo fmt --check
      - name: Build visualizer
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Binary size
        run: |
          ls -lh target/release/pertylizer | awk '{print "Pertylizer size:", $5}'
          ls -lh visualizer/target/release/pertylizer-visualizer | awk '{print "Visualizer size:", $5}'
      - name: Upload pertylizer binary
        uses: actions/upload-artifact@v4
        with:
          name: pertylizer-ubuntu
          path: target/release/pertylizer
      - name: Upload visualizer binary
        uses: actions/upload-artifact@v4
        with:
          name: visualizer-ubuntu
          path: visualizer/target/release/pertylizer-visualizer

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Format check
        run: cargo fmt --check
      - name: Build visualizer
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Binary size
        run: |
          ls -lh target/release/pertylizer | awk '{print "Pertylizer size:", $5}'
          ls -lh visualizer/target/release/pertylizer-visualizer | awk '{print "Visualizer size:", $5}'
      - name: Upload pertylizer binary
        uses: actions/upload-artifact@v4
        with:
          name: pertylizer-macos
          path: target/release/pertylizer
      - name: Upload visualizer binary
        uses: actions/upload-artifact@v4
        with:
          name: visualizer-macos
          path: visualizer/target/release/pertylizer-visualizer

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Format check
        run: cargo fmt --check
      - name: Build visualizer
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Binary size
        shell: pwsh
        run: |
          $size = (Get-Item target\release\pertylizer.exe).Length / 1MB
          Write-Host ("Pertylizer size: {0:N1} MB" -f $size)
          $vsize = (Get-Item visualizer\target\release\pertylizer-visualizer.exe).Length / 1MB
          Write-Host ("Visualizer size: {0:N1} MB" -f $vsize)
      - name: Upload pertylizer binary
        uses: actions/upload-artifact@v4
        with:
          name: pertylizer-windows
          path: target/release/pertylizer.exe
      - name: Upload visualizer binary
        uses: actions/upload-artifact@v4
        with:
          name: visualizer-windows
          path: visualizer/target/release/pertylizer-visualizer.exe

  release:
    name: Release
    needs: [ubuntu, macos, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' crates/pertylizer/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" docs/history.md > /tmp/changelog.md

      - name: Download artifacts
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        if: steps.check.outputs.exists == 'false'
        run: |
          cd artifacts
          mv pertylizer-ubuntu/pertylizer pertylizer-linux-x86_64
          mv pertylizer-macos/pertylizer pertylizer-macos-aarch64
          mv pertylizer-windows/pertylizer.exe pertylizer-windows-x86_64.exe
          mv visualizer-ubuntu/pertylizer-visualizer pertylizer-visualizer-linux-x86_64
          mv visualizer-macos/pertylizer-visualizer pertylizer-visualizer-macos-aarch64
          mv visualizer-windows/pertylizer-visualizer.exe pertylizer-visualizer-windows-x86_64.exe
          chmod +x pertylizer-linux-x86_64 pertylizer-macos-aarch64
          chmod +x pertylizer-visualizer-linux-x86_64 pertylizer-visualizer-macos-aarch64

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Pertylizer ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/changelog.md \
            artifacts/pertylizer-linux-x86_64 \
            artifacts/pertylizer-macos-aarch64 \
            artifacts/pertylizer-windows-x86_64.exe \
            artifacts/pertylizer-visualizer-linux-x86_64 \
            artifacts/pertylizer-visualizer-macos-aarch64 \
            artifacts/pertylizer-visualizer-windows-x86_64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
