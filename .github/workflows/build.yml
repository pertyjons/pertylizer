name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev
      - name: Check MSRV
        run: cargo check --all-targets

  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Format check
        run: cargo fmt --check
      - name: Binary size
        run: ls -lh target/release/pertylizer | awk '{print "Binary size:", $5}'
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pertylizer-ubuntu
          path: target/release/pertylizer

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Format check
        run: cargo fmt --check
      - name: Binary size
        run: ls -lh target/release/pertylizer | awk '{print "Binary size:", $5}'
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pertylizer-macos
          path: target/release/pertylizer

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Format check
        run: cargo fmt --check
      - name: Binary size
        run: Get-Item target\release\pertylizer.exe | ForEach-Object { "Binary size: $([math]::Round($_.Length / 1MB, 1)) MB" }
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pertylizer-windows
          path: target/release/pertylizer.exe

  release:
    name: Release
    needs: [audit, msrv, ubuntu, macos, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' crates/pertylizer/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" docs/history.md > /tmp/changelog.md

      - name: Download artifacts
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        if: steps.check.outputs.exists == 'false'
        run: |
          cd artifacts
          mv pertylizer-ubuntu/pertylizer pertylizer-linux-x86_64
          mv pertylizer-macos/pertylizer pertylizer-macos-aarch64
          mv pertylizer-windows/pertylizer.exe pertylizer-windows-x86_64.exe
          chmod +x pertylizer-linux-x86_64 pertylizer-macos-aarch64

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Pertylizer ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/changelog.md \
            artifacts/pertylizer-linux-x86_64 \
            artifacts/pertylizer-macos-aarch64 \
            artifacts/pertylizer-windows-x86_64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
