name: Build & Test

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --check
      - name: Build visualizer
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Assemble package
        run: bash packaging/assemble.sh linux x86_64
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: ${{ env.PKG_NAME }}.zip

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --check
      - name: Build visualizer
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Assemble package
        run: bash packaging/assemble.sh macos aarch64
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: ${{ env.PKG_NAME }}.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --check
      - name: Build visualizer
        run: cargo build --release --manifest-path visualizer/Cargo.toml
      - name: Assemble package
        shell: pwsh
        run: ./packaging/assemble.ps1 -Os windows -Arch x86_64
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: ${{ env.PKG_NAME }}.zip

  release:
    name: Release
    needs: [ubuntu, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            # Curated highlights for this version from docs/history.md.
            awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" docs/history.md
            echo
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Linux (x86_64) | \`pertylizer-$VERSION-linux-x86_64.zip\` |"
            echo "| macOS (Apple Silicon) | \`pertylizer-$VERSION-macos-aarch64.zip\` |"
            echo "| Windows (x86_64) | \`pertylizer-$VERSION-windows-x86_64.zip\` |"
            echo
            echo "Each archive bundles both apps, example projects, AI-CLI MCP configs, and an editable \`pertylizer.toml\`. See the bundled \`README.md\` to get started."
          } > /tmp/notes.md

      - name: Download packages
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Pertylizer ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            artifacts/package-linux/*.zip \
            artifacts/package-macos/*.zip \
            artifacts/package-windows/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
