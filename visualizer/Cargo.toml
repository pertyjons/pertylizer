[package]
name = "pertylizer-visualizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Bevy 3D visualizer for Pertylizer — driven by OSC telemetry"
authors = ["Per Jonsson"]
license = "MIT"
repository = "https://github.com/pertyjons/pertylizer"

[dependencies]
bevy = "0.19.0"
crossbeam-channel = "0.5.16"
fastrand = "2.5.0"
rosc = "0.11.4"
socket2 = "0.6.5"
synth_osc_protocol = { path = "../crates/synth_osc_protocol" }
synth_config = { path = "../crates/synth_config" }
